# Server stack (prod aj staging): jedna definicia, dva nasadenia.
#   prod:    /opt/work-tracker          (COMPOSE_PROJECT_NAME=task-tracker, EDGE_ALIAS=wt-prod-nginx)
#   staging: /opt/work-tracker-staging  (COMPOSE_PROJECT_NAME=task-tracker-staging, EDGE_ALIAS=wt-stage-nginx)
# Spusta sa cez deploy.sh, rucne: docker compose -f compose.server.yaml up -d
# Ziadne publikovane porty: 80/443 vlastni edge stack (compose.edge.yaml, D-02); nginx sa
# k nemu pripaja cez externu siet `edge` pod aliasom EDGE_ALIAS.
# Obrazy php a nginx idu z GHCR podla IMAGE_PREFIX a IMAGE_TAG. writable/ je na volume.
# Bez Mailpitu, bez build, bez bind mountov kodu. DB nema publikovane porty.
#
# Tajomstva su rozdelene podla toho, kto ich potrebuje (WR-06, docs/ops/server.md sekcia 15):
#   .env         iba interpolacia compose a deploy.sh (projekt, alias, domena, TLS, IMAGE_PREFIX), bez hesiel
#   app.env      CI4 runtime pre php-fpm: iba app_rw, mail, encryption.key, pepper
#   migrate.env  app.env + database.owner.* (app_owner), iba jednorazovy kontajner migrate
#   secrets/db_*_password  hesla roli pre inicializaciu DB (Docker secrets, *_FILE)
# Nazov projektu z .env: prod musi ostat task-tracker (zdiela volumes task-tracker_pgdata a
# task-tracker_writable); `:?` zabrani, aby stack potichu prebral cudzi projekt.
name: ${COMPOSE_PROJECT_NAME:?Chýba COMPOSE_PROJECT_NAME v .env}

services:
  php:
    image: ${IMAGE_PREFIX:?}-php:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      TZ: Europe/Bratislava
    volumes:
      - ./app.env:/var/www/html/.env:ro
      - writable:/var/www/html/writable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: ${IMAGE_PREFIX:?}-nginx:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      # PROXY protocol z edge a znacka noindex (iba staging, prod prazdne), viď docker/nginx.
      NGINX_PROXY_PROTOCOL: proxy_protocol
      NGINX_ROBOTS_TAG: ${NGINX_ROBOTS_TAG:-}
      APP_DOMAIN: ${APP_DOMAIN:?}
      NGINX_HSTS_VALUE: ${NGINX_HSTS_VALUE:?}
      SSL_CERT: ${SSL_CERT:?}
      SSL_KEY: ${SSL_KEY:?}
    volumes:
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      default: {}
      edge:
        aliases: ["${EDGE_ALIAS:?Chýba EDGE_ALIAS v .env}"]
    depends_on: [php]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Hesla iba ako subory (Docker secrets); pouziju sa len pri inicializacii prazdneho volume.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      DB_RW_PASSWORD_FILE: /run/secrets/db_rw_password
      TZ: Europe/Bratislava
      PGTZ: Europe/Bratislava
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=192MB
      -c max_connections=20
      -c timezone=Europe/Bratislava
      -c log_timezone=Europe/Bratislava
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres:/opt/provision:ro
    secrets:
      - db_superuser_password
      - db_owner_password
      - db_rw_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Iba na vyziadanie z deploy.sh: migracie ako app_owner. Heslo app_owner vidi iba tento
  # jednorazovy kontajner, nie php-fpm (WR-06).
  migrate:
    image: ${IMAGE_PREFIX:?}-php:${IMAGE_TAG:?}
    profiles: ["migrate"]
    environment:
      TZ: Europe/Bratislava
    volumes:
      - ./migrate.env:/var/www/html/.env:ro
      - writable:/var/www/html/writable
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "spark", "migrate", "-g", "owner", "--all"]

  # Iba na vyziadanie: docker compose -f compose.server.yaml run --rm certbot ...
  certbot:
    image: certbot/dns-cloudflare:v5.8.0
    profiles: ["certbot"]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./secrets/cloudflare.ini:/secrets/cloudflare.ini:ro

networks:
  default: {}
  edge:
    external: true
    name: edge

volumes:
  pgdata:
  writable:

secrets:
  db_superuser_password:
    file: ./secrets/db_superuser_password
  db_owner_password:
    file: ./secrets/db_owner_password
  db_rw_password:
    file: ./secrets/db_rw_password
