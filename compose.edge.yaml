# Edge stack: spusta sa v /opt/edge, instaluje sa rucne raz podla docs/ops/server.md
# (CI ho nenasadzuje). Jediny publikuje porty 80/443; prod a staging nginx sa k nemu
# pripajaju cez externu siet `edge`.
# Siet sa vytvara raz s pevnou podsietou, ktoru dôveruje realip v stack nginx:
#   docker network create --driver bridge --subnet 10.250.250.0/24 edge
name: edge

services:
  edge:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge]

networks:
  edge:
    external: true
    name: edge
