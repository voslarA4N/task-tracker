# Skutocna IP klienta za edge proxy (docs/ops/server.md).
# Retaz: Cloudflare -> edge nginx (stream, PROXY protocol) -> tento nginx.
# $remote_addr je edge kontajner z podsiete 10.250.250.0/24 (docker network edge);
# iba od neho prijimame CF-Connecting-IP. $binary_remote_addr (limit_req AUTH-04)
# tak ostava adresou klienta, nie edge kontajnera.
set_real_ip_from 10.250.250.0/24;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Anti-spoof: PROXY-protocol zdroj musi byt rozsah Cloudflare (geo v http.d/cf-peer.conf),
# inak by hocijaky klient mohol podstrcit CF-Connecting-IP. Mimo Cloudflare: zatvor spojenie.
if ($cf_peer = 0) {
    return 444;
}
