# Rekurzivny resolver iba pre siet `mail` (10.250.251.0/24); nie je publikovany na host.
server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.250.251.0/24 allow
    # DNSSEC: koren dovery z balika, aktualizuje sa automaticky (RFC 5011)
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    msg-cache-size: 8m
    rrset-cache-size: 16m
    num-threads: 1
    so-rcvbuf: 0
    so-sndbuf: 0
    verbosity: 0
    use-syslog: no
    logfile: ""
    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"
    pidfile: ""
