# TLS terminacia pre webmail/autoconfig/autodiscover/mta-sts za edge proxy (docs/ops/mail.md).
# Retaz: Cloudflare -> edge nginx (stream, PROXY protocol) -> tento nginx -> roundcube / stalwart:8080.
# Stalwart admin (/admin, /api, /jmap) sa odtialto nikdy nedostane von: iba whitelist ciest nizsie.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # $host v logu: runbook (docs/ops/mail.md) podla neho overuje smerovanie edge -> web
    log_format mail '$remote_addr host=$host "$request" $status';
    access_log /dev/stdout mail;

    # Docker DNS; upstreamy cez premenne, takze zastaveny kontajner nezhodi start nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # $cf_peer (444 mimo Cloudflare), rovnaky zdroj pravdy ako stack nginx
    include /etc/nginx/http.d/cf-peer.conf;

    ssl_certificate     /etc/letsencrypt/live/mail.vostack.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.vostack.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Limit prihlasovania do webmailu podla skutocnej IP klienta (realip z CF-Connecting-IP).
    map "$request_method:$arg__task" $login_key {
        default    "";
        "POST:login" $binary_remote_addr;
    }
    limit_req_zone $login_key zone=mlogin:1m rate=10r/m;

    server {
        listen 443 ssl proxy_protocol default_server;
        http2 on;
        include /etc/nginx/realip/edge.conf;
        return 444;
    }

    server {
        listen 443 ssl proxy_protocol;
        http2 on;
        server_name webmail.vostack.dev;
        include /etc/nginx/realip/edge.conf;

        client_max_body_size 25m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location / {
            set $rc http://roundcube:8000;
            limit_req zone=mlogin burst=5 nodelay;
            proxy_pass $rc;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Iba dokumenty, ktore musi vidiet svet; vsetko ostatne 404.
    server {
        listen 443 ssl proxy_protocol;
        http2 on;
        server_name autoconfig.vostack.dev autodiscover.vostack.dev mta-sts.vostack.dev;
        include /etc/nginx/realip/edge.conf;

        add_header X-Content-Type-Options nosniff always;

        location = /mail/config-v1.1.xml {
            set $sw http://stalwart:8080;
            proxy_pass $sw;
            proxy_set_header Host $host;
        }
        location ^~ /.well-known/autoconfig/ {
            set $sw http://stalwart:8080;
            proxy_pass $sw;
            proxy_set_header Host $host;
        }
        # Outlook posiela /Autodiscover/Autodiscover.xml (rozne velke pismena)
        location ~* ^/autodiscover/ {
            set $sw http://stalwart:8080;
            proxy_pass $sw;
            proxy_set_header Host $host;
        }
        location = /.well-known/mta-sts.txt {
            set $sw http://stalwart:8080;
            add_header Cache-Control "no-store" always;
            proxy_pass $sw;
            proxy_set_header Host $host;
        }
        location / {
            return 404;
        }
    }
}
