# Edge proxy: jediny vlastnik host portov 80 a 443 (docs/ops/server.md, D-02).
# Smeruje TLS spojenia podla SNI na nginx prod alebo staging stacku bez rozbalenia TLS
# (passthrough), takze kazdy stack si drzi vlastny certifikat, hlavicky aj CSP a HTTP/2
# sa dohaduje (ALPN) priamo so stackom.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

stream {
    # Docker DNS; mena sa rozlisuju za behu, takze zastaveny stack nezhodi start edge.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format sni '$remote_addr sni=$ssl_preread_server_name upstream=$upstream_addr status=$status';
    access_log /dev/stdout sni;

    # Neznamy alebo chybajuci SNI ide na 127.0.0.1:1 (spojenie odmietnute = zatvorene).
    map $ssl_preread_server_name $wt_upstream {
        work-tracker.vostack.dev       wt-prod-nginx:443;
        work-tracker-stage.vostack.dev wt-stage-nginx:443;
        default                        127.0.0.1:1;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $wt_upstream;
        # Stack nginx dostane PROXY hlavicku s adresou Cloudflare peera (anti-spoof, cf-peer.conf).
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}

http {
    server_tokens off;
    access_log off;

    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }
}
