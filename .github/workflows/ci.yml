name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Tajomstva nesmu byt v gite
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$|\.pem$|^docker/certs/|cloudflare\.ini|\.dump$' | grep -vE '(^|/)\.env\.example$'; then
            echo "V gite su tajomstva (.env, .env.*, *.pem, docker/certs/, cloudflare.ini, *.dump)" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS testy (app.js, CR-01)
        run: node --test tests/js/*.test.js

      - name: Build dev a prod target
        run: |
          docker build --target dev -t task-tracker-php:ci .
          docker build --target prod -t task-tracker-php:prod .

      - name: Provisioning DB (task_tracker a task_tracker_test)
        run: |
          for db in task_tracker task_tracker_test; do
            docker run --rm --network host -v "$PWD/docker/postgres:/p:ro" \
              -e PGPASSWORD=ci-superuser -e DB_OWNER_PASSWORD=ci-owner -e DB_RW_PASSWORD=ci-rw \
              postgres:18-alpine \
              psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -v dbname="$db" \
              -f /p/provision.sql
          done

      - name: .env pre CI (efemerna DB, nie skutocne tajomstva)
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^database\.\([a-z_]*\)\.hostname = .*/database.\1.hostname = 127.0.0.1/' \
            -e '/^database\.\(default\|tests\)\.password/ s/= .*/= ci-rw/' \
            -e '/^database\.\(owner\|tests_owner\)\.password/ s/= .*/= ci-owner/' \
            .env
          sed -i "s/^auth\.backupCodePepper =.*/auth.backupCodePepper = $(openssl rand -hex 32)/" .env

      - name: "Prod obraz: migracie na CI DB"
        run: |
          docker run --rm --network host -v "$PWD/.env:/var/www/html/.env:ro" \
            task-tracker-php:prod php spark migrate -g owner --all

      - name: composer install, migracie testovacej DB, composer check
        run: |
          docker run --rm --network host -e CI=true \
            -v "$PWD:/var/www/html" -w /var/www/html task-tracker-php:ci \
            sh -c 'composer install --no-interaction --prefer-dist && php spark key:generate --force && composer test:migrate && composer check'

      - name: Preload nezhodi PHP
        run: |
          out=$(docker run --rm task-tracker-php:prod php -d opcache.enable_cli=1 -d opcache.preload=/var/www/html/preload.php -d opcache.preload_user=www-data -r 'echo 1;')
          test "$out" = "1"

  # Vetvovy model (docs/ops/server.md): develop -> staging, main -> produkcia (environment
  # production s povinnym schvalenim). Ostatne vetvy (feature/*, hotfix/*) iba check.
  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://work-tracker.vostack.dev' || 'https://work-tracker-stage.vostack.dev' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Ciel nasadenia
        run: |
          case "$GITHUB_REF_NAME" in
            main)
              {
                echo "TARGET_DIR=/opt/work-tracker"
                echo "APP_DOMAIN=work-tracker.vostack.dev"
                echo "BRANCH_TAG=main"
                echo "SMOKE_PROJECT=task-tracker"
                echo "SMOKE_EXPECT_NOINDEX=0"
              } >> "$GITHUB_ENV"
              ;;
            develop)
              {
                echo "TARGET_DIR=/opt/work-tracker-staging"
                echo "APP_DOMAIN=work-tracker-stage.vostack.dev"
                echo "BRANCH_TAG=develop"
                echo "SMOKE_PROJECT=task-tracker-staging"
                echo "SMOKE_EXPECT_NOINDEX=1"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "Vetva $GITHUB_REF_NAME sa nenasadzuje" >&2
              exit 1
              ;;
          esac

      - name: Prefix obrazov (male pismena)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login do GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build obrazov
        run: |
          docker build --platform linux/amd64 --target prod \
            -t "$PREFIX-php:sha-$GITHUB_SHA" -t "$PREFIX-php:$BRANCH_TAG" .
          docker build --platform linux/amd64 -f docker/nginx/Dockerfile \
            -t "$PREFIX-nginx:sha-$GITHUB_SHA" -t "$PREFIX-nginx:$BRANCH_TAG" .

      - name: Push obrazov
        run: |
          for t in "$PREFIX-php:sha-$GITHUB_SHA" "$PREFIX-php:$BRANCH_TAG" "$PREFIX-nginx:sha-$GITHUB_SHA" "$PREFIX-nginx:$BRANCH_TAG"; do
            docker push "$t"
          done

      - name: SSH priprava
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config

      - name: Nasadenie
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          T="$DEPLOY_USER@$DEPLOY_HOST"
          # shellcheck disable=SC2086
          scp $SSH_OPTS compose.server.yaml compose.server.mail.yaml scripts/deploy.sh scripts/cert-renew.sh "$T:$TARGET_DIR/"
          # shellcheck disable=SC2086
          scp -r $SSH_OPTS docker/postgres "$T:$TARGET_DIR/docker/"
          # Vlastny docker config na stack: login jedneho stacku nezasiahne druhy.
          # shellcheck disable=SC2086,SC2029
          echo "$GHCR_TOKEN" | ssh $SSH_OPTS "$T" "mkdir -p -m 700 $TARGET_DIR/.docker && DOCKER_CONFIG=$TARGET_DIR/.docker docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "$T" "chmod +x $TARGET_DIR/deploy.sh $TARGET_DIR/cert-renew.sh"
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "$T" "cd $TARGET_DIR && DOCKER_CONFIG=$TARGET_DIR/.docker IMAGE_PREFIX=$PREFIX IMAGE_TAG=sha-$GITHUB_SHA sh ./deploy.sh"

      - name: Smoke
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_TARGET="$DEPLOY_USER@$DEPLOY_HOST" \
          sh scripts/smoke-server.sh "$APP_DOMAIN"
